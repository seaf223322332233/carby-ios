# ============================================
# Codemagic configuration for Flutter iOS project
# ============================================
# ✅ This is now a Flutter project
# ============================================

workflows:
  ios-workflow:
    name: iOS Workflow - تطبيق وجباتي
    max_build_duration: 120
    instance_type: mac_mini_m1
    integrations:
      app_store_connect: codemagic
    environment:
      groups:
        - app_store_credentials
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Get Flutter dependencies
        script: |
          echo "============================================"
          echo "Getting Flutter dependencies..."
          echo "============================================"
          flutter pub get
      - name: Set up code signing settings on Xcode project
        script: |
          echo "============================================"
          echo "Setting up code signing..."
          echo "============================================"
          xcode-project use-profiles
      - name: Build ipa for distribution
        script: |
          echo "============================================"
          echo "Building IPA..."
          echo "============================================"
          flutter build ipa \
            --release \
            --export-options-plist=exportOptions.plist
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      email:
        recipients:
          - your-email@example.com
        notify:
          success: true
          failure: true
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - "Internal Testers"

